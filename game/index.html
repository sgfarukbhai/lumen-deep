<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Deep</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020812; }
  #game { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lumen Deep: swim the lanternfish with the mouse or WASD, collect glowing motes to keep the light fed, dodge shadow eels and urchins"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
